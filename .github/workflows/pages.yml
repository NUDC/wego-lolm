name: Pages

# 官网部署。版本号从 app/src-tauri/Cargo.toml 注入，和 APK 同一个来源。
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'app/src-tauri/Cargo.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 排队而不是取消，避免并发部署把新版盖成旧版
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 站点用 pnpm：npm 解析这套依赖会命中某个发布元数据里带 workspace:* 的
      # 坏版本而直接失败，pnpm 能正常处理。app/ 那边仍然用 npm。
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: site

      - name: 构建站点
        working-directory: site
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' ../app/src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then echo "读不到 Cargo.toml 的 version"; exit 1; fi
          echo "version = $VERSION"
          VITE_APP_VERSION="$VERSION" pnpm build
          grep -q "$VERSION" dist/assets/*.js || { echo "版本号没进产物"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deploy
        uses: actions/deploy-pages@v4
