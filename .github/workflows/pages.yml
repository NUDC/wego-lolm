name: Pages

# 官网部署。版本号在这里从 Cargo.toml 注入，保持和 APK 同一个来源。
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'app/src-tauri/Cargo.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，排队而不是取消，避免覆盖出旧版本
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 注入版本号
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' app/src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then echo "读不到 Cargo.toml 的 version"; exit 1; fi
          echo "version = $VERSION"
          mkdir -p _site
          cp -r site/. _site/
          sed -i "s/__VERSION__/${VERSION}/g" _site/index.html
          grep -q "__VERSION__" _site/index.html && { echo "占位符替换失败"; exit 1; } || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
