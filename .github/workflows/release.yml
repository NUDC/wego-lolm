name: Release

# 打 v* 标签时构建签名 APK 并发到 GitHub Release。
# 只出 arm64：现代手机都是这个架构。x86_64 仅模拟器需要，本地自行构建即可。
# 资产名固定，官网下载按钮指向 releases/latest/download/<该名字>，不随版本变。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ASSET: lolm-switcher-arm64-release.apk

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 必须显式指定 packages：默认值里的 `tools` 早已从 Android 仓库下架，
      # 不覆盖就会 "Failed to find package 'tools'" 直接失败。
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          local-cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - run: npm ci
        working-directory: app

      - name: 写入签名材料
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "缺少 secret ANDROID_KEYSTORE_BASE64——没有它打出来的包无法签名"
            exit 1
          fi
          AND=app/src-tauri/gen/android
          mkdir -p "$AND/app"
          echo "$KEYSTORE_B64" | base64 -d > "$AND/app/release.jks"
          # storeFile 由 app 模块目录解析，所以用相对于 gen/android/app 的路径
          cat > "$AND/keystore.properties" <<EOF
          storeFile=release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      # gen/android 里的 tauri.settings.gradle / app/tauri.build.gradle.kts 被 gitignore
      # （内容含本机 cargo registry 的绝对路径），但 settings.gradle 用 apply from 强依赖
      # 它们，而 `tauri android build` 不会重新生成——只有 init 会。
      # init 会覆盖已跟踪的文件（签名配置和版本读取都在 app/build.gradle.kts 里），
      # 所以紧接着用 git 恢复；新生成的 ignore 文件不受影响，正好带着 CI 本地路径。
      - name: 重建 Android 工程骨架
        working-directory: app
        run: npx tauri android init --skip-targets-install

      - name: 恢复手工维护的 Android 配置
        run: git checkout -- app/src-tauri/gen/android

      - name: 构建 APK
        working-directory: app
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: npx tauri android build --apk --target aarch64

      - name: 核对版本、架构与签名
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' app/src-tauri/Cargo.toml | cut -d'"' -f2)

          # 单 target 时产物目录名不固定，直接找最新的 release apk
          SRC=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -path '*release*' \
                | head -1)
          test -n "$SRC" || { echo "没找到 release APK"; exit 1; }
          echo "apk = $SRC"
          mkdir -p dist
          cp "$SRC" "dist/$ASSET"

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump badging "dist/$ASSET" | grep -E "^package:|native-code"
          "$BT/apksigner" verify -v "dist/$ASSET"

          # 混进 x86_64 说明构建参数没生效
          if "$BT/aapt" dump badging "dist/$ASSET" | grep -q "x86"; then
            echo "产物里混入了 x86 架构"; exit 1
          fi

          # 标签与 Cargo.toml 必须一致，否则发出去的版本号对不上
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "标签 $GITHUB_REF_NAME 与 Cargo.toml 的 $VERSION 不一致"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          name: v${{ steps.meta.outputs.version }}
          files: dist/${{ env.ASSET }}
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: apk
          path: dist/${{ env.ASSET }}
